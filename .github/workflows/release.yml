name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/CopilotBooster.csproj -c Release --nologo
          dotnet build tests/CopilotBooster.Tests.csproj -c Release --nologo
          dotnet build tests/CopilotBooster.IntegrationTests.csproj -c Release --nologo

      - name: Format check
        run: dotnet format copilot-booster.sln --verify-no-changes --verbosity normal

      - name: Unit Tests
        run: dotnet test tests/CopilotBooster.Tests.csproj -c Release --nologo --verbosity normal

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          dotnet build tests/CopilotBooster.IntegrationTests.csproj -c Release --nologo
          $pw = Get-ChildItem -Path tests/bin-integration -Recurse -Filter "playwright.ps1" | Select-Object -First 1
          if ($pw) { & pwsh $pw.FullName install chromium }

      - name: Integration Tests
        run: dotnet run --project tests/CopilotBooster.IntegrationTests.csproj -c Release

  dispatch-signing:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger code signing workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_PAT }}" \
            https://api.github.com/repos/rogerbarreto/copilot-booster-signing/dispatches \
            -d '{"event_type":"release-sign","client_payload":{"tag":"${{ github.ref_name }}","sha":"${{ github.sha }}"}}'
