name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/CopilotBooster.csproj -c Release --nologo
          dotnet build tests/CopilotBooster.Tests.csproj -c Release --nologo
          dotnet build tests/CopilotBooster.IntegrationTests.csproj -c Release --nologo

      - name: Format check
        run: dotnet format copilot-booster.sln --verify-no-changes --verbosity normal

      - name: Unit Tests
        run: dotnet run --project tests/CopilotBooster.Tests.csproj -c Release

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          dotnet build tests/CopilotBooster.IntegrationTests.csproj -c Release --nologo
          $pw = Get-ChildItem -Path tests/bin -Recurse -Filter "playwright.ps1" | Select-Object -First 1
          if ($pw) { & pwsh $pw.FullName install chromium }
          else { Write-Error "playwright.ps1 not found"; exit 1 }

      - name: Integration Tests
        run: dotnet run --project tests/CopilotBooster.IntegrationTests.csproj -c Release -- -trait "Category!=LocalOnly"

  signing-info:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Signing info
        run: |
          echo "## Ready for signing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
